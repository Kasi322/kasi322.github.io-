<header><div class="wrap">
<nav aria-label="Разделы сайта"><strong><span class="brand" aria-hidden="true">⌘</span> Сетевая лаборатория</strong><div class="links"><a href="#theory">Теория</a><a href="#sim">Симуляции</a><a href="#practice">Практика</a><a href="#quiz">Самопроверка</a></div></nav>
<div class="hero"><div><div class="eyebrow">Обслуживание ПК · локальные сети</div><h1>MAC, ARP<br>и сетевые порты</h1><p>Проследите путь кадра от компьютера к соседу или шлюзу. Затем выясните, как ОС доставляет данные нужной службе.</p><a class="btn" href="#sim">Открыть симуляции <span aria-hidden="true">↓</span></a></div>
<div class="stack"><strong>Поля назначения при обращении к службе</strong><div class="layer"><span>Ethernet · MAC</span><code>02:00:00:00:00:01</code></div><div class="layer ip"><span>IPv4 · узел</span><code>203.0.113.10</code></div><div class="layer port"><span>Служба · порт</span><code>443 / TCP</code></div><small>Пример первого перехода к удалённому HTTPS-серверу через шлюз.</small></div></div>
</div></header>
<main class="wrap">
<section id="theory"><div class="eyebrow">Теория</div><h2>Как данные находят получателя</h2><p class="intro">IP указывает конечный узел, MAC доставляет кадр на текущем Ethernet-участке, а порт помогает операционной системе определить нужную службу или соединение.</p>
<div class="grid">
<article class="card"><span class="tag">Канальный уровень</span><h3>MAC-адрес</h3><p>MAC — адрес сетевого интерфейса в локальном сегменте. Коммутатор учится сопоставлять MAC источника со своим физическим портом и использует таблицу при пересылке кадров.</p><div class="bytes mono" aria-label="Пример MAC-адреса 64-6C-80-36-0B-27"><span>64</span><span>6C</span><span>80</span><span>36</span><span>0B</span><span>27</span></div><p>Обычный Ethernet-адрес содержит 6 байт, или 48 бит. У глобально назначенных адресов первые три байта часто представляют OUI организации. Локально назначенные адреса могут иметь другой смысл префикса.</p></article>
<article class="card"><span class="tag">Сопоставление IPv4 и MAC</span><h3>ARP</h3><p>Чтобы сформировать Ethernet-кадр, компьютер ищет MAC следующего узла по его IPv4-адресу. Сначала он проверяет ARP-кэш.</p><div class="flow">Request → всем в сегменте</div><div class="flow">Reply → отправителю запроса</div><p>Адрес назначения запроса — <code>FF:FF:FF:FF:FF:FF</code>. В обычном сценарии узел с искомым IPv4 отвечает своему соседу, и тот сохраняет пару IPv4 ↔ MAC в кэше.</p></article>
<article class="card"><span class="tag">Транспортный уровень</span><h3>Сетевой порт</h3><p>Порт — число от 0 до 65535. В сетевой записи <code>203.0.113.10:443</code> после двоеточия указан порт. Пространства портов TCP и UDP независимы.</p><table class="port-table"><caption>Типичные службы</caption><thead><tr><th>Служба</th><th>Порт / протокол</th></tr></thead><tbody><tr><td>HTTP / HTTPS</td><td>80 / TCP, 443 / TCP</td></tr><tr><td>DNS</td><td>53 / UDP или TCP</td></tr><tr><td>SSH</td><td>22 / TCP</td></tr><tr><td>RDP</td><td>3389 / TCP и UDP</td></tr></tbody></table></article>
</div>
<details style="margin-top:16px"><summary>Диапазоны портов и две разные таблицы адресов</summary><p>Диапазоны IANA: системные 0–1023 (0 зарезервирован), пользовательские 1024–49151, динамические и частные 49152–65535. Операционная система выделяет временные клиентские порты из своего настроенного диапазона.</p><p><strong>ARP-кэш компьютера:</strong> IPv4 → MAC. <strong>MAC-таблица коммутатора:</strong> MAC → физический порт в пределах VLAN. Число 443 обозначает транспортный порт службы.</p></details>
</section>
<section id="sim"><div class="eyebrow">Симуляции</div><h2>Проследите путь данных</h2><p class="intro">Выберите получателя и нажимайте «Следующий шаг». После первой отправки повторите её с заполненным кэшем.</p>
<article class="lab"><h3>ARP и первый переход</h3><p>Учебная сеть <code>192.168.113.0/24</code>. ПК A отправляет ICMP Echo Request. У ICMP нет транспортных портов.</p>
<div class="toolbar"><label for="target">Получатель<select id="target"><option value="local">ПК B · 192.168.113.184</option><option value="remote">Удалённый сервер · 203.0.113.10</option><option value="absent">Узел без ответа · 192.168.113.99</option></select></label><button id="next">Следующий шаг</button><button id="again" class="secondary" disabled>Новая отправка</button><button id="clear" class="secondary">Очистить кэш</button></div>
<div class="network" aria-label="Учебная топология"><div class="node" id="node-a"><strong>ПК A</strong><code>192.168.113.10</code><code>02:00:00:00:00:0A</code><small></small></div><div class="node" id="node-switch"><strong>Коммутатор</strong><code>Сегмент LAN</code><small></small></div><div class="node" id="node-b"><strong>ПК B</strong><code>192.168.113.184</code><code>02:00:00:00:00:0B</code><small></small></div><div class="node" id="node-g"><strong>Шлюз</strong><code>192.168.113.1</code><code>02:00:00:00:00:01</code><small></small></div></div>
<div class="packet"><div><b>Событие</b><span id="event">Ожидание</span></div><div><b>Целевой IPv4</b><code id="packet-ip">—</code></div><div><b>MAC назначения кадра</b><code id="packet-mac">—</code></div></div>
<p class="status" id="arp-status" role="status">Начните с определения следующего узла.</p>
<div class="lab-grid"><div class="scroll"><table class="cache-table"><caption>ARP-кэш ПК A</caption><thead><tr><th>IPv4</th><th>MAC</th><th>Тип</th></tr></thead><tbody id="cache"></tbody></table></div><div><h3>Журнал событий</h3><ol id="log" class="log"></ol></div></div>
</article>
<article class="lab"><h3>Адреса и порты службы</h3><p>Выберите сценарий. Сравните поля исходящих данных и ответа. Клиентский порт <code>53124</code> выбран для примера.</p><div class="toolbar"><label for="service">Служба<select id="service"><option value="https">HTTPS · 443 / TCP</option><option value="dns">DNS · 53 / UDP</option><option value="ssh">SSH · 22 / TCP</option></select></label><button id="reply" class="secondary" aria-pressed="false">Показать ответ</button></div>
<div class="address-output" aria-live="polite"><div><b>Источник</b><code id="from">192.168.113.10:53124</code></div><div><b>Назначение</b><code id="to">203.0.113.10:443</code></div><div><b>Транспорт</b><code id="protocol">TCP</code></div></div><p class="status" id="service-note">Запрос идёт на порт HTTPS-службы.</p>
</article></section>
<section id="practice"><div class="eyebrow">Практика на Windows</div><h2>Исследуйте свою сеть</h2><p class="intro">Работайте в учебной сети и используйте адреса, которые выдал преподаватель. Для каждого шага запишите наблюдение и объясните результат.</p>
<details open><summary>Шаг 1. Найдите MAC, IPv4 и шлюз активного адаптера</summary><code class="cmd">getmac /v
ipconfig /all</code><p>Выберите активный адаптер Ethernet или Wi‑Fi. Запишите название, физический адрес, IPv4, маску и основной шлюз. Сопоставьте оба вывода по MAC.</p></details>
<details><summary>Шаг 2. Прочитайте ARP-таблицу</summary><code class="cmd">arp -a</code><p>Найдите блок своего интерфейса. Выпишите пять строк при наличии, укажите IPv4, MAC и тип. Если строк меньше, запишите все и отметьте их количество. Найдите шлюз при наличии записи и объясните разницу между <code>dynamic</code> и <code>static</code>. Определите назначение <code>FF-FF-FF-FF-FF-FF</code>.</p></details>
<details><summary>Шаг 3. Сравните кэш до и после ping</summary><code class="cmd">arp -a
ping &lt;IPv4 разрешённого ПК&gt;
arp -a</code><p>Замените текст в угловых скобках на адрес соседа из вашей подсети. Сравните строку искомого IPv4 до и после команды. Нарисуйте ARP Request и ARP Reply с адресами назначения. Если запись уже была, объясните, как такой кэш меняет обмен. Тайм-аут ping возможен даже при успешном ARP, например если узел фильтрует ICMP.</p></details>
<details><summary>Шаг 4. Определите, какой процесс использует порт</summary><code class="cmd">netstat -an
netstat -ano
tasklist /FI "PID eq 1234"</code><p>Выпишите пять строк TCP при наличии. Для каждой укажите локальный адрес и порт, удалённый адрес и порт, состояние и PID. Объясните, как отличить локальный порт от удалённого. Подставьте реальный PID вместо <code>1234</code>. Для <code>LISTENING</code> объясните, что процесс ожидает подключения. Для <code>ESTABLISHED</code> определите оба конца установленного соединения.</p></details>
<details><summary>Шаг 5. Сравните подключения до и после открытия сайта</summary><p>Сохраните вывод <code>netstat -ano</code> или откройте TCPView, если он установлен. Откройте учебный HTTPS-сайт и снова посмотрите подключения. Сопоставьте строки с процессом браузера по PID. Если новой строки нет, запишите наблюдение и предложите объяснение, например повторное использование уже открытого соединения. По таблице теории заполните соответствия для портов 22, 53, 80, 443 и 3389.</p></details>
<details><summary>Шаг 6. Проверьте доступность портов 80 и 443</summary><code class="cmd">Test-NetConnection -ComputerName &lt;учебный сервер&gt; -Port 80
Test-NetConnection -ComputerName &lt;учебный сервер&gt; -Port 443</code><p>В PowerShell подставьте имя или адрес учебного сервера. Для каждой проверки запишите <code>RemoteAddress</code>, <code>RemotePort</code> и <code>TcpTestSucceeded</code>. Если проверка не прошла, предложите две возможные причины и укажите, какие данные нужны, чтобы их различить. Успешный результат подтверждает возможность TCP-подключения к выбранному порту.</p></details>
<details><summary>Сложный сценарий. Узел отвечает на ARP, но служба недоступна</summary><p>Учебный ПК в вашей подсети появился в <code>arp -a</code>. Проверка служебного порта вернула <code>False</code>. Объясните, что уже известно о локальной связи. Укажите, как на сервере отличить отсутствие слушающего процесса от фильтрации трафика, используя состояние порта и настройки межсетевого экрана. Затем в симуляции выберите удалённый сервер и запишите отдельно IPv4 получателя и MAC первого перехода.</p></details>
<p class="status"><strong>Сдача работы.</strong> Подготовьте <code>Группа_Фамилия_ARP.pdf</code>. Включите выводы команд или снимки экрана, таблицу ARP до и после <code>ping</code>, схему Request/Reply, найденные PID и вывод по каждому шагу.</p></section>
<section id="quiz"><div class="eyebrow">Самопроверка</div><h2>Проверьте себя</h2><p class="intro">Ответьте на четыре вопроса. После проверки под каждым вопросом появится объяснение.</p>
<form id="quiz-form" class="quiz">
<fieldset data-answer="b" data-explain="ПК A запрашивает MAC шлюза, потому что первый Ethernet-кадр передаётся шлюзу в локальной сети."><legend>1. Какой MAC ищет ПК для удалённого IPv4?</legend><label><input type="radio" name="q1" value="a"> MAC удалённого сервера</label><label><input type="radio" name="q1" value="b"> MAC локального интерфейса шлюза</label><p class="feedback"></p></fieldset>
<fieldset data-answer="a" data-explain="При пустом кэше Ethernet-кадр ARP Request обычно адресуется всем устройствам локального сегмента."><legend>2. Кому адресован обычный ARP Request?</legend><label><input type="radio" name="q2" value="a"> FF:FF:FF:FF:FF:FF</label><label><input type="radio" name="q2" value="b"> MAC запрашивающего ПК</label><p class="feedback"></p></fieldset>
<fieldset data-answer="b" data-explain="Клиент отправил запрос с порта 53124 на 443. При ответе исходным портом становится 443, а портом назначения — 53124."><legend>3. Какой порт назначения у ответа HTTPS-сервера клиенту с портом 53124?</legend><label><input type="radio" name="q3" value="a"> 443</label><label><input type="radio" name="q3" value="b"> 53124</label><p class="feedback"></p></fieldset>
<fieldset data-answer="a" data-explain="ARP-кэш хранит пары IPv4 и MAC. Причину недоступности отдельно проверяют на уровне службы и связи с её портом."><legend>4. Что показывает запись для соседа в ARP-кэше?</legend><label><input type="radio" name="q4" value="a"> Известно соответствие IPv4 и MAC</label><label><input type="radio" name="q4" value="b"> HTTPS-сервер доступен</label><p class="feedback"></p></fieldset>
<div class="toolbar"><button type="submit">Проверить ответы</button><button type="reset" class="secondary">Сбросить ответы</button></div><p id="score" role="status"></p>
</form></section></main>
<footer class="wrap">Сетевая лаборатория · учебный материал для занятия по обслуживанию ПК</footer>
