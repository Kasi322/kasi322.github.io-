<script>
const byId = (id) => document.getElementById(id);
const scenarios = {
  local: { ip: "192.168.113.184", hop: "192.168.113.184", mac: "02:00:00:00:00:0B", node: "b", route: "ПК B находится в той же подсети. ПК A ищет MAC самого ПК B." },
  remote: { ip: "203.0.113.10", hop: "192.168.113.1", mac: "02:00:00:00:00:01", node: "g", route: "Адрес сервера находится вне подсети. ПК A выбирает шлюз 192.168.113.1 как следующий узел." },
  absent: { ip: "192.168.113.99", hop: "192.168.113.99", mac: null, route: "Искомый IPv4 находится в локальной подсети. ПК A пытается узнать MAC этого узла." }
};
const cache = new Map();
const nodes = ["a", "switch", "b", "g"];
let steps = [];
let index = 0;

function showNodes(labels = {}) {
  for (const node of nodes) {
    const element = byId("node-" + node);
    element.classList.toggle("active", Boolean(labels[node]));
    element.querySelector("small").textContent = labels[node] || "";
  }
}

function showCache() {
  const body = byId("cache");
  body.replaceChildren();
  if (!cache.size) {
    const cell = body.insertRow().insertCell();
    cell.colSpan = 3;
    cell.textContent = "Кэш пуст";
  }
  for (const [ip, mac] of cache) {
    const row = body.insertRow();
    for (const value of [ip, mac, "dynamic"]) row.insertCell().textContent = value;
  }
}

function buildSteps(target) {
  const {ip, hop, mac, node, route} = target;
  const steps = [{ title: "Выбор следующего узла", ip, note: route, labels: { a: "Выбор маршрута" } }];
  if (cache.has(hop)) {
    steps.push({ title: "Попадание в ARP-кэш", ip: hop, mac: cache.get(hop), note: "ПК A берёт MAC из кэша и сразу может сформировать кадр.", labels: { a: "Читает кэш" } });
  } else {
    steps.push({
      title: "ARP Request · broadcast", ip: hop, mac: "FF:FF:FF:FF:FF:FF",
      note: "ПК A спрашивает, кому принадлежит " + hop + ". Коммутатор пересылает запрос остальным участникам сегмента.",
      labels: { a: "Отправляет запрос", switch: "Рассылает", b: "Получает запрос", g: "Получает запрос" }
    });
    if (!mac) {
      steps.push({ title: "Тайм-аут ARP", ip: hop, note: "Ответа нет. После попыток разрешения адреса ПК A не может отправить ICMP-кадр этому получателю. Кэш не пополняется.", labels: { a: "Ожидает ответ" } });
      return steps;
    }
    steps.push({
      title: "ARP Reply · unicast", ip: "192.168.113.10", mac: "02:00:00:00:00:0A",
      note: "Владелец " + hop + " сообщает свой MAC " + mac + ". ПК A сохраняет пару в ARP-кэше.",
      labels: { [node]: "Отправляет ответ", switch: "Пересылает", a: "Обновляет кэш" },
      learn: [hop, mac]
    });
  }
  steps.push({
    title: "Кадр с ICMP Echo Request", ip, mac,
    note: node === "b"
      ? "Коммутатор доставляет кадр на ПК B. IPv4 и MAC назначения принадлежат его интерфейсу."
      : "Кадр приходит на шлюз, а IPv4 назначения указывает на сервер. Шлюз пересылает IP-пакет дальше с новым канальным заголовком на следующем Ethernet-участке.",
    labels: { a: "Отправляет кадр", switch: "Пересылает", [node]: "Получает кадр" }
  });
  return steps;
}

function resetSequence(message) {
  index = 0;
  steps = buildSteps(scenarios[byId("target").value]);
  byId("next").disabled = false;
  byId("again").disabled = true;
  byId("event").textContent = "Ожидание";
  byId("packet-ip").textContent = "—";
  byId("packet-mac").textContent = "—";
  byId("arp-status").textContent = message;
  byId("log").replaceChildren();
  showNodes();
  showCache();
}

byId("next").addEventListener("click", () => {
  const step = steps[index++];
  if (step.learn) cache.set(...step.learn);
  byId("event").textContent = step.title;
  byId("packet-ip").textContent = step.ip;
  byId("packet-mac").textContent = step.mac || "—";
  byId("arp-status").textContent = step.note;
  const entry = document.createElement("li");
  entry.textContent = step.title;
  byId("log").append(entry);
  showNodes(step.labels);
  showCache();
  const finished = index === steps.length;
  byId("next").disabled = finished;
  byId("again").disabled = !finished;
  if (finished) byId("again").focus();
});

byId("target").addEventListener("change", () => resetSequence("Получатель изменён. Начните с выбора следующего узла."));
byId("again").addEventListener("click", () => {
  resetSequence("Новая отправка. Посмотрите, как ПК использует текущий кэш.");
  byId("next").focus();
});
byId("clear").addEventListener("click", () => {
  cache.clear();
  resetSequence("Кэш очищен. При следующей отправке компьютер выполнит ARP-запрос.");
});
resetSequence("Начните с определения следующего узла.");

const services = {
  https: { name: "HTTPS", port: 443, protocol: "TCP" },
  dns: { name: "DNS", port: 53, protocol: "UDP" },
  ssh: { name: "SSH", port: 22, protocol: "TCP" }
};
let replying = false;
function showService() {
  const service = services[byId("service").value];
  const client = "192.168.113.10:53124";
  const server = "203.0.113.10:" + service.port;
  byId("from").textContent = replying ? server : client;
  byId("to").textContent = replying ? client : server;
  byId("protocol").textContent = service.protocol;
  byId("reply").setAttribute("aria-pressed", String(replying));
  byId("reply").textContent = replying ? "Показать запрос" : "Показать ответ";
  byId("service-note").textContent = replying
    ? "Ответ службы " + service.name + " адресован клиентскому порту 53124."
    : "Запрос идёт на порт " + service.port + " службы " + service.name + ".";
}
byId("service").addEventListener("change", showService);
byId("reply").addEventListener("click", () => {
  replying = !replying;
  showService();
});
showService();

const quiz = byId("quiz-form");
const questions = [...quiz.querySelectorAll("fieldset")];
quiz.addEventListener("submit", (event) => {
  event.preventDefault();
  let correct = 0;
  let answered = 0;
  for (const question of questions) {
    const choice = question.querySelector("input:checked");
    const feedback = question.querySelector(".feedback");
    const valid = choice?.value === question.dataset.answer;
    if (choice) answered++;
    if (valid) correct++;
    feedback.classList.toggle("error", !valid);
    feedback.textContent = choice
      ? (valid ? "Верно. " : "Попробуйте ещё раз. ") + question.dataset.explain
      : "Выберите вариант ответа.";
  }
  byId("score").textContent = "Верных ответов: " + correct + " из " + questions.length + ". Отвечено: " + answered + ".";
});
quiz.addEventListener("reset", () => {
  for (const question of questions) question.querySelector(".feedback").textContent = "";
  byId("score").textContent = "";
});
</script>
</body>
</html>
